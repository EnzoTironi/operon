name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting and lints
        run: pnpm run check

      - name: Check dead code and unused dependencies
        run: pnpm run lint:knip

      - name: Build all packages
        run: pnpm -r run build

      # Postgres-backed suites start a postgres:17-alpine testcontainer
      # through vitest global setup; CI=true makes a missing Docker fatal.
      - name: Run test suites
        run: pnpm -r run test

      - name: Bring up the cell Postgres with Alchemy
        run: pnpm cell:up

      - name: Wait for the cell to report healthy
        run: |
          for _ in $(seq 1 30); do
            container="$(docker ps -q --filter name=operoncell-postgres)"
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker ps
          exit 1

      - name: Run the Postgres suites against the Alchemy cell
        run: |
          set -a; . ./.env; set +a
          OPERON_TEST_DATABASE_URL="$OPERON_DATABASE_URL" pnpm --filter @operon/runtime --filter @operon/cell-auth run test

      - name: Open the cell from the CLI and issue an approver session
        run: |
          pnpm operon doctor
          pnpm operon approver session --email ci@operon.invalid --name CI --json > /dev/null

      - name: Tear the cell down
        if: always()
        run: pnpm cell:down
