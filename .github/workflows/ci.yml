name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting and lints
        run: pnpm run check

      - name: Check dead code and unused dependencies
        run: pnpm run lint:knip

      - name: Build all packages
        run: pnpm -r run build

      - name: Run test suites
        run: pnpm -r run test

      - name: Run independent validation gates
        run: pnpm run test:validation

      - name: Comprehensive end-to-end verification
        run: pnpm run verify:all
